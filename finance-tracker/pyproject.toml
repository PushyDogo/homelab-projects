[project]
name = "finance-tracker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "keyring>=25.7.0",
    "nicegui>=3.17.1",
    "sqlcipher3>=0.6.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
finance-tracker = "finance_tracker.cli:main"
